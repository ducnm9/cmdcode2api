# Copy to docker-compose.yml first: cp docker-compose.example.yml docker-compose.yml
#
# First start: when the data directory is empty, config.yaml is generated and
# the api_key and admin_password are printed once (see `docker compose logs`),
# then the container restarts into serving mode.
#
# The server starts fine with no upstream account: sign in to the WebUI
# (http://<host>:11434/webui, password in the logs), paste a key on the
# Accounts tab or add one via OAuth to start serving; until then chat requests
# return 503.
#
# The OAuth callback listens on 127.0.0.1 inside the container, so it needs the
# host network:
#   docker compose run --rm --network host cmdcode2api --oauth
# Or configure accounts on the host and place config.yaml into ./data/.

services:
  cmdcode2api:
    image: ghcr.io/peach0x33a/cmdcode2api:latest
    container_name: cmdcode2api
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data:/data
    # WebUI: http://<host>:11434/webui
